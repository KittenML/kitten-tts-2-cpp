name: Python wheels

on:
  push:
    branches:
      - py-interface
  workflow_dispatch:
    inputs:
      model_test:
        description: Run real W4 speech synthesis too (requires HF_TOKEN for private models)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            arch: x86_64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - platform: macos-arm64
            runner: macos-14
            arch: arm64
          - platform: windows-x86_64
            runner: windows-2022
            arch: AMD64
          - platform: windows-arm64-experimental
            runner: windows-11-arm
            arch: ARM64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.KITTEN_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install wheel builder
        run: python -m pip install cibuildwheel==4.3.0
      - name: Build and test wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          KITTEN_WHEEL_NETWORK_TEST: '1'
          KITTEN_WHEEL_MODEL_TEST: ${{ inputs.model_test && '1' || '0' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CIBW_ENVIRONMENT_PASS_LINUX: HF_TOKEN KITTEN_WHEEL_MODEL_TEST KITTEN_WHEEL_NETWORK_TEST
      - uses: actions/upload-artifact@v4
        with:
          name: kitten-tts-cpp-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # CUDA builds of the same package, each compiled with the CUDA release of the PyTorch build whose CUDA runtime and
  # cuBLAS it uses. One job per Python version keeps each build inside the job time limit. The runners have no GPU,
  # so the smoke test checks import, CPU use and the "no CUDA device" error.
  wheels-cuda:
    name: ${{ matrix.platform }}-${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64-cuda, windows-x86_64-cuda]
        python: [cp310, cp311, cp312, cp313, cp314]
        include:
          - platform: linux-x86_64-cuda
            runner: ubuntu-24.04
            arch: x86_64
            tag: manylinux_x86_64
            artifact: linux-x86_64
            package: kitten-tts-cpp-cu12
          - platform: windows-x86_64-cuda
            runner: windows-2022
            arch: AMD64
            tag: win_amd64
            artifact: windows-x86_64
            package: kitten-tts-cpp-cu13
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.KITTEN_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      # The toolkit release that the Windows CUDA build of PyTorch is built with
      - name: Install CUDA 13.0 (compiler, runtime, cuBLAS, NVRTC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\cuda_13.0.3_windows_network.exe"
          Invoke-WebRequest -Uri https://developer.download.nvidia.com/compute/cuda/13.0.3/network_installers/cuda_13.0.3_windows_network.exe -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '-s nvcc_13.0 crt_13.0 nvvm_13.0 nvptxcompiler_13.0 cudart_13.0 cublas_13.0 cublas_dev_13.0 nvrtc_13.0 nvrtc_dev_13.0 thrust_13.0 visual_studio_integration_13.0' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "CUDA installer failed with exit code $($process.ExitCode)" }
          $cuda = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.0'
          & "$cuda\bin\nvcc.exe" --version
          "CUDA_PATH=$cuda" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$cuda\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install wheel builder
        run: python -m pip install cibuildwheel==4.3.0
      - name: Build and test wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.tag }}
          CIBW_ARCHS: ${{ matrix.arch }}
          KITTEN_CUDA: '1'
          CIBW_BEFORE_ALL_LINUX: sh {project}/packaging/install_cuda_linux.sh
          # 4 vCPU and 16 GB runners: one compile job per vCPU.
          CIBW_ENVIRONMENT_LINUX: >-
            KITTEN_CUDA=1 KITTEN_PORTABLE=1 CMAKE_BUILD_PARALLEL_LEVEL=4 CMAKE_ARGS="-DLLAMA_BUILD_LIBRESSL=ON"
            PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cu129
            CUDACXX=/usr/local/cuda-12.8/bin/nvcc PATH=/usr/local/cuda-12.8/bin:$PATH
          CIBW_ENVIRONMENT_WINDOWS: >-
            KITTEN_CUDA=1 KITTEN_PORTABLE=1 CMAKE_BUILD_PARALLEL_LEVEL=4 CMAKE_GENERATOR=Ninja
            CMAKE_ARGS="-DLLAMA_BUILD_LIBRESSL=ON"
            PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cu130
          KITTEN_WHEEL_NETWORK_TEST: '1'
          KITTEN_WHEEL_MODEL_TEST: ${{ inputs.model_test && '1' || '0' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CIBW_ENVIRONMENT_PASS_LINUX: HF_TOKEN KITTEN_WHEEL_MODEL_TEST KITTEN_WHEEL_NETWORK_TEST
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.artifact }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
