[build-system]
requires = ["setuptools>=68", "wheel", "cmake>=3.21", "torch==2.13.0"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp3{10,11,12,13,14}-*"
skip = ["*-musllinux_*", "*-manylinux_i686", "*-manylinux_ppc64le", "*-manylinux_s390x", "*-manylinux_armv7l", "*-manylinux_riscv64", "*-win32", "*-macosx_x86_64", "*-macosx_universal2", "cp310-win_arm64", "cp314-win_arm64"]
build-frontend = { name = "pip", args = ["--no-build-isolation"] }
before-build = "python {project}/packaging/prepare_wheel.py"
repair-wheel-command = "python {project}/packaging/repair_wheel.py {wheel} {dest_dir}"
test-command = "python {project}/packaging/smoke_wheel.py"
test-requires = ["numpy", "soundfile"]

[tool.cibuildwheel.environment]
KITTEN_PORTABLE = "1"
CMAKE_BUILD_PARALLEL_LEVEL = "2"
CMAKE_ARGS = "-DLLAMA_BUILD_LIBRESSL=ON"
PIP_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cpu"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "14.0"
KITTEN_PORTABLE = "1"
CMAKE_BUILD_PARALLEL_LEVEL = "2"
CMAKE_ARGS = "-DLLAMA_BUILD_LIBRESSL=ON"
PIP_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cpu"

[tool.cibuildwheel.windows]
archs = ["AMD64", "ARM64"]

[[tool.cibuildwheel.overrides]]
select = "*-win_arm64"
inherit.environment = "append"
environment = { CMAKE_ARGS = "-DLLAMA_BUILD_LIBRESSL=ON -T ClangCL -A ARM64" }
